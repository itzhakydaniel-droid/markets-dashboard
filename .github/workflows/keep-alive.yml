name: Keep dashboard awake
on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours — well inside the ~12h hibernation window
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping dashboard
        run: |
          curl -sL --max-time 60 -o /dev/null -w "status %{http_code}\n" \
            "https://itzhakydaniel-droid-markets-dashboard-app-qhwxui.streamlit.app/" \
            -H "User-Agent: Mozilla/5.0 (keepalive-bot)"
